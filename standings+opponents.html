    <title>Standings</title>

    <style>

        body { font-family: sans-serif; }

        .table-container { overflow-x: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 0.95em; }

        th { background-color: #f2f2f2; position: sticky; top: 0; z-index: 1; }

        th, td { padding: 6.17px 4px; border: 1px solid #ddd; }

        .header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

        .header h1 { margin: 0; font-size: 1.1rem; margin-bottom: 5px; }

        tr:nth-child(even) { background-color: #f9f9f9; }

        .numeric { text-align: center; }

        .text { text-align: left; }

        a { text-decoration: underline; cursor: pointer; color: inherit; }

        .legend { font-size: 0.75em; padding: 5px; }

        ul { margin: 0; padding-left: 20px; }

        .links { font-size: 0.9em; }

    </style>

    <script>

        function toggle(id) {

            var element = document.getElementById(id);

            element.style.display = (element.style.display === "table-row") ? "none" : "table-row";

        }

    </script>

</head>

<body>

<h1>DSD Jr High Basketball Standings</h1>

            <thead>

                    <th class="numeric">L</th>

                    <th class="numeric">OOWP</th>

                    <th class="numeric">RPI</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

    <div class="legend">

        Updated on: October 21, 2026<br>

        WP: Winning Percentage<br>

        OWP: Opponents' Winning Percentage (past and future games)<br>

        OOWP: Opponents' Opponents' Winning Percentage<br>

        RPI: Rating Percentage Index (45% WP + 45% OWP + 10% OOWP)

    </div>
